<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro TravelMate 98</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Dosis:wght@500;700&family=VT323&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #008080; /* Classic Win95 Teal Desktop */
            font-family: 'Dosis', sans-serif;
            image-rendering: pixelated;
        }
        /* Retro 95 Bevel Styles */
        .win-window {
            background-color: #c0c0c0;
            border-top: 2px solid #ffffff;
            border-left: 2px solid #ffffff;
            border-right: 2px solid #404040;
            border-bottom: 2px solid #404040;
            box-shadow: 4px 4px 10px rgba(0, 0, 0, 0.4);
        }
        .win-titlebar {
            background: linear-gradient(90deg, #000080, #1084d0);
        }
        .win-button {
            background-color: #c0c0c0;
            border-top: 2px solid #ffffff;
            border-left: 2px solid #ffffff;
            border-right: 2px solid #404040;
            border-bottom: 2px solid #404040;
            active:border-top: 2px solid #404040;
            active:border-left: 2px solid #404040;
            active:border-right: 2px solid #ffffff;
            active:border-bottom: 2px solid #ffffff;
        }
        .win-button:active {
            border-top: 2px solid #404040;
            border-left: 2px solid #404040;
            border-right: 2px solid #ffffff;
            border-bottom: 2px solid #ffffff;
            padding-top: 3px;
            padding-left: 3px;
        }
        .win-input {
            background-color: #ffffff;
            border-top: 2px solid #404040;
            border-left: 2px solid #404040;
            border-right: 2px solid #ffffff;
            border-bottom: 2px solid #ffffff;
        }
        .win-inset {
            background-color: #ffffff;
            border-top: 2px solid #404040;
            border-left: 2px solid #404040;
            border-right: 2px solid #ffffff;
            border-bottom: 2px solid #ffffff;
        }
        .pixel-font {
            font-family: 'VT323', monospace;
        }
    </style>
</head>
<body class="min-h-screen p-2 sm:p-6 flex flex-col justify-between">

    <!-- Top Retro Header Bar -->
    <header class="win-window px-4 py-2 flex items-center justify-between mb-4">
        <div class="flex items-center space-x-2">
            <i class="fa-solid fa-earth-americas text-blue-900 text-lg"></i>
            <span class="font-bold text-sm tracking-wider text-black">TRAVEL98.EXE - AI Itinerary Generator</span>
        </div>
        <div class="flex space-x-1">
            <button class="win-button px-2 py-0.5 text-xs font-bold leading-none">_</button>
            <button class="win-button px-2 py-0.5 text-xs font-bold leading-none">□</button>
            <button class="win-button px-2 py-0.5 text-xs font-bold leading-none text-red-700">✕</button>
        </div>
    </header>

    <!-- Main Container Window -->
    <main class="max-w-xl w-full mx-auto flex-1 flex flex-col justify-center">

        <!-- Planner Form Window -->
        <div id="formWindow" class="win-window p-4 sm:p-6 mb-6">
            <div class="win-titlebar text-white px-3 py-1.5 mb-4 flex items-center justify-between">
                <span class="text-sm font-bold flex items-center"><i class="fa-solid fa-suitcase mr-2"></i> 여행 설정 마법사 v1.0</span>
                <span class="pixel-font text-lg">READY</span>
            </div>

            <form id="plannerForm" class="space-y-4">
                <!-- Destination -->
                <div>
                    <label class="block text-xs font-bold text-black mb-1 uppercase">
                        📍 1. 여행지 (Destination)
                    </label>
                    <input type="text" id="destination" required placeholder="예: 서울, 오사카, 뉴욕" 
                        class="w-full px-3 py-2 win-input text-sm text-black focus:outline-none">
                </div>

                <!-- Grid for Duration & Companion -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <!-- Duration -->
                    <div>
                        <label class="block text-xs font-bold text-black mb-1 uppercase">
                            📅 2. 여행 기간
                        </label>
                        <select id="duration" class="w-full px-3 py-2 win-input text-sm text-black focus:outline-none">
                            <option value="1">1일 (당일치기)</option>
                            <option value="2">2박 3일 (3일)</option>
                            <option value="3" selected>3박 4일 (4일)</option>
                            <option value="4">4박 5일 (5일)</option>
                            <option value="5">5박 6일 이상</option>
                        </select>
                    </div>

                    <!-- Companion -->
                    <div>
                        <label class="block text-xs font-bold text-black mb-1 uppercase">
                            👥 3. 동행인
                        </label>
                        <select id="companion" class="w-full px-3 py-2 win-input text-sm text-black focus:outline-none">
                            <option value="혼자">혼자서</option>
                            <option value="친구">친구와 함께</option>
                            <option value="연인">연인과 함께</option>
                            <option value="가족">가족과 함께</option>
                        </select>
                    </div>
                </div>

                <!-- Interests -->
                <div>
                    <label class="block text-xs font-bold text-black mb-2 uppercase">
                        ❤️ 4. 주요 관심사 (다중 선택 가능)
                    </label>
                    <div class="flex flex-wrap gap-2" id="interestTags">
                        <button type="button" data-value="맛집투어" class="interest-tag win-button px-3 py-1.5 text-xs font-medium text-black">🍽️ 맛집투어</button>
                        <button type="button" data-value="카페탐방" class="interest-tag win-button px-3 py-1.5 text-xs font-medium text-black">☕ 카페탐방</button>
                        <button type="button" data-value="역사/문화" class="interest-tag win-button px-3 py-1.5 text-xs font-medium text-black">🏛️ 역사/문화</button>
                        <button type="button" data-value="쇼핑" class="interest-tag win-button px-3 py-1.5 text-xs font-medium text-black">🛍️ 쇼핑</button>
                        <button type="button" data-value="자연/힐링" class="interest-tag win-button px-3 py-1.5 text-xs font-medium text-black">🌿 자연/힐링</button>
                        <button type="button" data-value="액티비티" class="interest-tag win-button px-3 py-1.5 text-xs font-medium text-black">🎢 액티비티</button>
                    </div>
                </div>

                <!-- Submit Button -->
                <div class="pt-2 text-center">
                    <button type="submit" class="win-button px-6 py-2.5 text-sm font-bold text-black bg-[#c0c0c0] hover:bg-[#d4d4d4] flex items-center justify-center mx-auto space-x-2">
                        <i class="fa-solid fa-bolt text-amber-600"></i>
                        <span>AI 일정 자동 생성 실행 (.EXE)</span>
                    </button>
                </div>
            </form>
        </div>

        <!-- Loading Window (Hidden) -->
        <div id="loadingWindow" class="win-window p-6 mb-6 hidden text-center space-y-4">
            <div class="win-titlebar text-white px-3 py-1 mb-2 text-left font-bold text-sm">
                시스템 처리 중...
            </div>
            <div class="py-6 space-y-3">
                <div class="inline-block animate-bounce text-3xl">⏳</div>
                <p class="font-bold text-black text-sm">Gemini AI가 최적의 여행 경로를 연산 중입니다...</p>
                <div class="w-full win-inset h-4 bg-white relative overflow-hidden">
                    <div class="bg-blue-800 h-full w-2/3 animate-pulse"></div>
                </div>
            </div>
        </div>

        <!-- Results Window (Hidden) -->
        <div id="resultsWindow" class="win-window p-4 sm:p-6 mb-6 hidden space-y-4">
            <div class="win-titlebar text-white px-3 py-1.5 flex items-center justify-between">
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-map-location-dot"></i>
                    <span id="resultHeaderTitle" class="text-sm font-bold">생성된 여행 일정 및 지도 위치</span>
                </div>
                <button id="resetBtn" class="win-button text-black text-xs px-2 py-0.5 font-bold">새로 만들기</button>
            </div>

            <!-- Itinerary Days Container -->
            <div id="itineraryContainer" class="space-y-4 max-h-[60vh] overflow-y-auto pr-1">
                <!-- Days will be injected here -->
            </div>
        </div>
    </main>

    <!-- Footer Status Bar -->
    <footer class="win-window px-3 py-1 text-xs text-black flex items-center justify-between">
        <div class="flex items-center space-x-2">
            <span class="w-2 h-2 bg-green-600 rounded-full inline-block"></span>
            <span>시스템 정상 작동 중 (Vercel API 연동됨)</span>
        </div>
        <span class="pixel-font text-sm">1998 Microsoft Windows</span>
    </footer>

    <!-- Retro Message Box / Toast -->
    <div id="toast" class="fixed bottom-12 left-1/2 transform -translate-x-1/2 win-window px-4 py-2 text-xs font-bold text-black opacity-0 pointer-events-none transition-opacity duration-200 z-50 flex items-center space-x-2 bg-yellow-100">
        <i class="fa-solid fa-triangle-exclamation text-amber-600"></i>
        <span id="toastMessage">알림 내용</span>
    </div>

    <script>
        // Tag selection logic
        const selectedInterests = new Set();
        document.querySelectorAll('.interest-tag').forEach(tag => {
            tag.addEventListener('click', () => {
                const value = tag.getAttribute('data-value');
                if (selectedInterests.has(value)) {
                    selectedInterests.delete(value);
                    tag.style.backgroundColor = '#c0c0c0';
                    tag.style.borderTop = '2px solid #ffffff';
                    tag.style.borderLeft = '2px solid #ffffff';
                } else {
                    selectedInterests.add(value);
                    tag.style.backgroundColor = '#a0a0a0';
                    tag.style.borderTop = '2px solid #404040';
                    tag.style.borderLeft = '2px solid #404040';
                }
            });
        });

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMessage').innerText = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 3000);
        }

        // Form Submission
        document.getElementById('plannerForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const destination = document.getElementById('destination').value.trim();
            const duration = parseInt(document.getElementById('duration').value);
            const companion = document.getElementById('companion').value;
            const interests = Array.from(selectedInterests);

            if (!destination) {
                showToast('여행지를 입력해주세요!');
                return;
            }

            document.getElementById('formWindow').classList.add('hidden');
            document.getElementById('loadingWindow').classList.remove('hidden');

            let itineraryData = null;

            try {
                const response = await fetch('/api/plan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ destination, duration, companion, interests })
                });

                if (response.ok) {
                    itineraryData = await response.json();
                } else {
                    throw new Error('API not ready');
                }
            } catch (err) {
                await new Promise(resolve => setTimeout(resolve, 1500));
                itineraryData = generateMockItinerary(destination, duration, companion, interests);
            }

            document.getElementById('loadingWindow').classList.add('hidden');
            renderItinerary(destination, duration, companion, itineraryData);
            document.getElementById('resultsWindow').classList.remove('hidden');
            showToast('일정이 성공적으로 생성되었습니다!');
        });

        document.getElementById('resetBtn').addEventListener('click', function() {
            document.getElementById('resultsWindow').classList.add('hidden');
            document.getElementById('formWindow').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // Fallback Mock Generator
        function generateMockItinerary(destination, duration, companion, interests) {
            const days = [];
            const interestStr = interests.length > 0 ? interests.join(', ') : '종합 관광';

            for (let i = 1; i <= duration; i++) {
                let activities = [];
                if (i === 1) {
                    activities = [
                        { time: '10:00', title: `${destination} 공항/역 도착 및 숙소 이동`, desc: '체크인 후 가벼운 주변 탐색' },
                        { time: '13:00', title: '현지 로컬 맛집 점심 식사', desc: `${interestStr} 관련 유명 식당 방문` },
                        { time: '16:00', title: '메인 랜드마크 및 시내 투어', desc: '대표 명소 기념 촬영 및 산책' },
                        { time: '19:30', title: '첫째 날 야경 및 저녁 만찬', desc: '분위기 있는 레스토랑에서 휴식' }
                    ];
                } else if (i === duration) {
                    activities = [
                        { time: '09:30', title: '호텔 조식 및 여유로운 오전', desc: '근처 카페에서 커피와 디저트' },
                        { time: '11:30', title: '기념품 쇼핑 및 특산품 구매', desc: '로컬 마켓 및 상점가 방문' },
                        { time: '14:30', title: '공항/역 이동 및 여행 마무리', desc: '귀가 길 안전하게 이동' }
                    ];
                } else {
                    activities = [
                        { time: '09:30', title: '오전 액티비티 및 문화 탐방', desc: `${destination} 특색 있는 명소 체험` },
                        { time: '13:00', title: '숨은 골목 맛집 런치', desc: '현지인 추천 맛집 탐방' },
                        { time: '15:30', title: '감성 포토스팟 & 휴식처', desc: '인생샷 남기기 좋은 장소' },
                        { time: '19:00', title: '근사한 디너 코스', desc: `${companion}와(과) 함께하는 특별한 저녁` }
                    ];
                }
                days.push({ dayNumber: i, title: `Day ${i}: ${destination} 탐험`, activities });
            }
            return days;
        }

        // Render Results with Map Links
        function renderItinerary(destination, duration, companion, data) {
            document.getElementById('resultHeaderTitle').innerText = `${destination} (${companion} 동행, ${duration}일 일정)`;
            const container = document.getElementById('itineraryContainer');
            container.innerHTML = '';

            data.forEach((dayObj) => {
                const dayBox = document.createElement('div');
                dayBox.className = 'win-inset p-3 bg-white';

                let actsHtml = '';
                dayObj.activities.forEach(act => {
                    // Google Maps Search URL encoded query
                    const mapQuery = encodeURIComponent(`${destination} ${act.title}`);
                    const mapUrl = `https://www.google.com/maps/search/?api=1&query=${mapQuery}`;

                    actsHtml += `
                        <div class="py-2 border-b border-dashed border-slate-300 last:border-0 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                            <div class="flex items-start space-x-3">
                                <span class="pixel-font text-base bg-blue-900 text-white px-2 py-0.5 rounded-none shrink-0">${act.time}</span>
                                <div>
                                    <h5 class="text-sm font-bold text-black">${act.title}</h5>
                                    <p class="text-xs text-slate-600">${act.desc}</p>
                                </div>
                            </div>
                            <a href="${mapUrl}" target="_blank" rel="noopener noreferrer" class="win-button px-2.5 py-1 text-xs font-bold text-black flex items-center justify-center space-x-1 shrink-0 bg-[#e0e0e0] hover:bg-[#d0d0d0]">
                                <i class="fa-solid fa-map-location text-red-600"></i>
                                <span>지도에서 위치 확인</span>
                            </a>
                        </div>
                    `;
                });

                dayBox.innerHTML = `
                    <div class="font-bold text-xs bg-slate-300 px-2 py-1 mb-2 text-black border-l-4 border-blue-900 flex justify-between items-center">
                        <span>${dayObj.title}</span>
                        <span class="pixel-font text-sm">DAY ${dayObj.dayNumber}</span>
                    </div>
                    <div class="space-y-1">
                        ${actsHtml}
                    </div>
                `;
                container.appendChild(dayBox);
            });
        }
    </script>
</body>
</html>
